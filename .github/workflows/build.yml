name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build app (Vite)
        run: npm run build

      - name: Build library (tsup)
        run: npm run build:lib

      - uses: actions/upload-artifact@v4
        with:
          name: dist-app
          path: dist-app/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-lib
          path: dist/
