    <rect x="7.5" y="12" width="27" height="24" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2.2" stroke-linejoin="round" />
    <rect x="10.5" y="15" width="21" height="12.5" rx="0.8" fill="#f1f5f9" stroke="#475569" stroke-width="1.3" />
    <rect x="11.7" y="16.2" width="18.6" height="3.4" fill="#1976d2" />
    <path d="M9.5 31h23" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M11.5 33.5h7M23.5 33.5h7" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" />
  </g>
  <g transform="rotate(14 47 26)">
    <rect x="39.5" y="14" width="15" height="24" rx="1.5" fill="#f1f5f9" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M41.5 16v2.6M44 16v2.6M46.5 16v2.6M49 16v2.6M51.5 16v2.6" stroke="#d69e2e" stroke-width="1.4" stroke-linecap="round" />
