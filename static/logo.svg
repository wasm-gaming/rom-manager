<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ROM Manager">
  <!--
    The favicon: the same three cartridges as `src/components/BrandLogo.tsx` —
    NES behind, Mega Drive beside it, SNES in front — and the same geometry, laid
    out to sit inside the box after its tilt so nothing is cropped. Kept in step
    with that file by hand: a tab icon is painted before any stylesheet of ours
    exists, so it cannot import the component.
  -->
