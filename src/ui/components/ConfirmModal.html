<!--
  A yes / no question in a modal dialog. Emits `confirm` and `close` (the dialog
  closed by any means: the ×, Cancel, Escape, a click on the backdrop).
-->
<script :setup="{ open = false, title = '', message = '', confirmLabel = '', cancelLabel = '', danger = true, busy = false }" lang="ts">
  const [Icon, { t }] = await $importAll(['./Icon.html', '../state'])

  const dialog = (): HTMLDialogElement | null => $self('dialog')
  const sync = (isOpen: boolean) => {
    const element = dialog()
    if (!element) return
    if (isOpen && !element.open) element.showModal()
    else if (!isOpen && element.open) element.close()
  }
  const dismiss = () => dialog()?.close()
  const onBackdrop = (event: MouseEvent) => {
    if (event.target === dialog() && !busy) dismiss()
  }

  $: sync(open)

  await $mounted()

  sync(open)
</script>

<dialog class="modal-dialog confirm-dialog" :aria-label="title" @close="$emit('close')" @click="onBackdrop">
  <header class="modal-header">
    <h3>{{ title }}</h3>
    <button type="button" class="modal-close" @click="dismiss" :disabled="busy" :title="t('prefs.close')">
      <Icon name="close" />
    </button>
  </header>

  <div class="modal-content">
    <p class="modal-message">{{ message }}</p>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn-cancel" @click="dismiss" :disabled="busy">
      {{ cancelLabel || t('drop.cancel') }}
    </button>
    <button type="button" :class="danger ? 'btn-danger' : 'btn-apply'" @click="$emit('confirm')" :disabled="busy">
      {{ confirmLabel || t('modal.delete') }}
    </button>
  </div>
</dialog>
