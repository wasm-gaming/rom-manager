<!-- The tree's title and its toolbar. Emits `create-folder`, `add-files` and `delete-selected`. -->
<script :setup="{ busy = false, hasSelection = false, title = 'Library', labels = {} }" lang="ts">
  const Icon = await import('../Icon.html')
</script>

<div class="file-tree-header">
  <h3>{{ title }}</h3>
  <div class="file-tree-actions">
    <button @click="$emit('create-folder')" :disabled="busy" :title="labels.newFolder ?? 'New folder'">
      <Icon name="folder-plus" />
    </button>
    <button @click="$emit('add-files')" :disabled="busy" :title="labels.addFiles ?? 'Add files'">
      <Icon name="plus" />
    </button>
    <button @click="$emit('delete-selected')" :disabled="busy || !hasSelection" :title="labels.delete ?? 'Delete'">
      <Icon name="trash" />
    </button>
  </div>
</div>
