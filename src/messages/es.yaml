# La interfaz, en español.
#
# El catálogo de referencia es `en.yaml`: lo que falte aquí se lee de allí, así
# que una traducción a medias se ve en inglés a trozos y nunca en blanco.
#
# El vocabulario es el de THESAURUS.md, con estas equivalencias fijas:
#   System → Sistema · Game → Juego · Variant → Variante
#   Medium → Soporte (cartucho / disco) · Consolidate → Consolidar
#   Plan → Plan · Cover Art → Carátula · DAT → DAT · Romset → Romset
# Se usan esas palabras para esas cosas, y no sinónimos según convenga.

app:
  name: 'ROM Manager'
  initializing: 'Arrancando…'

header:
  regions:
    label: 'Prioridad de región'
    preferred: 'Se prefiere la carátula de {region}'
    prefer: 'Preferir la carátula de {region}'
  preferences: 'Preferencias'

tabs:
  reconnect: 'Haz clic para volver a dar acceso'
  close: 'Cerrar'
