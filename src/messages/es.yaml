welcome:
  tagline: 'Tu colección retro, leída donde está'
  pitch: >-
    ROM Manager abre una carpeta de ROMs y hace una biblioteca con ella: cada
    fichero identificado por su checksum, cada Juego en una sola entrada con sus
    Variantes, y su Carátula al lado. Funciona entero en el navegador, contra tu
    propio disco.
  open: 'Abrir carpeta'
  opening: 'Abriendo…'
  hint: 'No se sube nada. No se mueve nada sin enseñártelo antes.'

  what:
    title: 'Qué hace'
    hash:
      title: 'Identifica por checksum'
      body: >-
        Cada fichero se contrasta con los DAT de No-Intro y Redump por su CRC32.
        El nombre de un fichero es lo que alguien escribió; el checksum es lo que
        el fichero es.
    grouping:
      title: 'Una entrada por Juego'
      body: >-
        Regiones, revisiones e idiomas de un mismo título se pliegan en un solo
        Juego, y sus Variantes se leen en el panel de detalles: cuáles tienes,
        qué ficheros faltan y a dónde se vendió cada una.
    covers:
      title: 'Una carátula por región'
      body: >-
        Cajas de EU, US y JP sacadas de libretro-thumbnails y guardadas en la
        biblioteca según navegas, así que siguen ahí con la red apagada. Un orden
        de preferencia decide cuál se enseña.
    consolidate:
      title: 'Nada se mueve sin tu permiso'
      body: >-
        Consolidar un Sistema se calcula como un Plan y se te enseña entero. No
        se renombra ni se mueve nada hasta que lo dices, y se puede deshacer justo
        después.

  how:
    title: 'Cómo funciona'
    step1:
      title: 'Abre tu colección'
      body: >-
        Elige la carpeta donde viven tus Sistemas: la carpeta `games` de MiSTer,
        o cualquiera montada igual.
    step2:
      title: 'Navégala por Juego'
      body: >-
        La carpeta de un Sistema se puede leer plana, tal cual está en disco, o
        agrupada, con los ficheros reconocidos plegados en el Juego del que son
        una edición.
    step3:
      title: 'Ordénala y complétala'
      body: >-
        Consolida la carpeta cuando el Plan te convenza, suelta carátulas o ROMs
        directamente sobre el panel, y edita lo que el catálogo no sepa.

  systems:
    title: 'Sistemas que conoce'
    hint: '{count} Sistemas, cada uno identificado por el nombre de carpeta que le da MiSTer.'

  privacy:
    title: 'No sale de tu máquina'
    body: >-
      Las carpetas se leen con la File System Access API, que te pide permiso
      para una carpeta y se lo da sólo a esta pestaña. No hay servidor ni subida
      de nada. Soporte real sólo hay en navegadores Chromium.

  footer:
    legal: 'ROM Manager es software libre de código abierto. Todos los nombres de sistemas, marcas y carátulas son propiedad de sus respectivos dueños.'
    github: 'Código en GitHub'

