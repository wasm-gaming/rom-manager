# The interface, in English.
#
# This is the reference catalogue: it holds every key, and a key another
# language is missing falls back to what is written here. Adding a string means
# adding it to this file first.
#
# The vocabulary is THESAURUS.md's — System, Game, Variant, Medium, Consolidate,
# Intake, Plan, DAT, Cover Art — and the words it defines are used for the
# things it defines them for, here and in every translation.
#
# Placeholders are named, `{like_this}`, so a translation is free to put them
# wherever its own grammar wants them.

