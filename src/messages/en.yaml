welcome:
  tagline: 'Your retro collection, read where it lives'
  pitch: >-
    ROM Manager opens a folder of ROMs and makes a library of it: every file
    identified by its checksum, every Game shown as one entry with its Variants,
    and its Cover Art alongside. It runs entirely in the browser, against your
    own disk.
  open: 'Open folder'
  opening: 'Opening…'
  hint: 'Nothing is uploaded. Nothing is moved without showing you first.'

  what:
    title: 'What it does'
    hash:
      title: 'Identified by checksum'
      body: >-
        Every file is matched against the No-Intro and Redump DATs by its CRC32.
        A file name is what somebody typed; a checksum is what the file is.
    grouping:
      title: 'One entry per Game'
      body: >-
        Regions, revisions and languages of the same title fold into a single
        Game, and its Variants are read in the details pane — which of them you
        have, which files are missing, and where each one ships.
    covers:
      title: 'Cover Art per region'
      body: >-
        Boxes for EU, US and JP, taken from libretro-thumbnails and kept in the
        library as you browse, so they stay there with the network off. A
        preference order decides which one is shown.
    consolidate:
      title: 'Moves you approve first'
      body: >-
        Consolidating a System is worked out as a Plan and shown to you whole.
        Nothing is renamed or moved until you say so, and it can be undone right
        afterwards.

  how:
    title: 'How it goes'
    step1:
      title: 'Open your collection'
      body: >-
        Pick the folder your Systems live in — the MiSTer `games` folder, or
        anything laid out like it.
    step2:
      title: 'Browse it by Game'
      body: >-
        A System folder can be read flat, as it is on disk, or grouped, with the
        recognised files folded into the Game they are releases of.
    step3:
      title: 'Tidy it up and fill it in'
      body: >-
        Consolidate the folder when the Plan convinces you, drop covers or ROMs
        straight onto the pane, and edit what the catalogue does not know.

  systems:
    title: 'Systems it knows'
    hint: '{count} Systems, each one identified by the folder name MiSTer gives it.'

  privacy:
    title: 'It never leaves your machine'
    body: >-
      Folders are read through the File System Access API, which asks your
      permission for one folder and grants it to this tab alone. There is no
      backend and no upload. Real support only exists in Chromium browsers.

